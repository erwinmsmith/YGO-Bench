[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ygobench"
version = "0.1.0"
description = "A reproducible Yu-Gi-Oh! benchmark harness for LLM agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.40.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "openai>=2.0.0",
    "pydantic>=2.8.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.2.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[project.scripts]
ygo-bench = "ygobench.cli:main"
ygo-bench-api = "backend.main:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["ygobench*", "backend*"]

[tool.setuptools.package-data]
ygobench = ["agents/prompts/*.md"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
